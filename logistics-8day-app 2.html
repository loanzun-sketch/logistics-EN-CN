<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Logistics 8 Ngày — EN/CN cho dân XNK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12233F; --navy-2:#1B3A63; --ink:#132033; --paper:#F2F4F1; --card:#FFFFFF;
  --line:#DEE3DE; --amber:#DD7E1F; --amber-dk:#B8630F; --teal:#1E6F6A; --teal-l:#E4F2F0;
  --amber-l:#FBEBD9; --red:#C4432E; --green:#2C8A5B; --muted:#5B6B72;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(18,35,63,.06), 0 6px 20px rgba(18,35,63,.07);
  font-size:16px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);
  position:relative;padding-bottom:14px;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none!important;}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
.topbar .back{background:none;border:none;color:#fff;font-size:20px;padding:4px 6px;border-radius:8px;}
.topbar .back:active{background:rgba(255,255,255,.15);}
.topbar .title{font-weight:800;font-size:15px;letter-spacing:.2px;}
.topbar .sub{font-size:11px;color:#B7C4D8;margin-top:1px;}
.stat-pill{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.12);padding:4px 9px;border-radius:20px;}

/* ---- home ---- */
.home-hero{background:var(--navy);color:#fff;padding:22px 20px 28px;border-radius:0 0 26px 26px;}
.home-hero .greet{font-size:13px;color:#9FB2CC;margin-bottom:2px;}
.home-hero h1{margin:0 0 14px;font-size:22px;font-weight:800;}
.hero-stats{display:flex;gap:10px;}
.hero-stat{flex:1;background:rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:10px 12px;}
.hero-stat .num{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.hero-stat .lbl{font-size:11px;color:#AFC0D6;margin-top:2px;}
.continue-btn{margin:16px 20px 6px;background:var(--amber);color:#fff;border:none;border-radius:var(--radius);
  padding:15px 18px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 6px 18px rgba(221,126,31,.35);}
.continue-btn small{display:block;font-weight:600;font-size:11.5px;opacity:.92;margin-top:2px;}

.route{padding:20px 20px 8px;position:relative;}
.route-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;}
.port{display:flex;gap:14px;position:relative;padding-bottom:22px;}
.port:last-child{padding-bottom:0;}
.port .track{width:34px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.port .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;font-family:'JetBrains Mono',monospace;border:2px solid var(--line);background:#fff;color:var(--muted);z-index:2;}
.port .dot.done{background:var(--teal);border-color:var(--teal);color:#fff;}
.port .dot.active{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 0 0 5px var(--amber-l);}
.port .dot.locked{color:#B7BFB8;}
.port .rope{flex:1;width:2px;background:var(--line);margin-top:2px;}
.port .rope.done{background:var(--teal);}
.port-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;
  margin-bottom:2px;}
.port-card.locked{opacity:.55;}
.port-card .d-num{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--amber-dk);font-weight:700;letter-spacing:.4px;}
.port-card h3{margin:2px 0 2px;font-size:14.5px;font-weight:800;}
.port-card .d-en{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
.progress-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
.progress-bar i{display:block;height:100%;background:var(--teal);}
.port-card .pct{font-size:10.5px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}

.review-card{margin:6px 20px 18px;background:var(--teal-l);border:1px solid #BFE0DB;border-radius:var(--radius);
  padding:14px 15px;}
.review-card h4{margin:0 0 4px;font-size:14px;font-weight:800;color:var(--teal);}
.review-card p{margin:0 0 10px;font-size:12.5px;color:#33564F;}
.review-btn{background:var(--teal);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;}

/* ---- lesson header / steps ---- */
.steps-row{display:flex;gap:5px;padding:10px 16px 4px;background:var(--navy);}
.step-chip{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.22);}
.step-chip.done{background:var(--amber);}
.step-chip.current{background:#fff;}

.content{flex:1;padding:18px 18px 100px;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber-dk);font-weight:700;letter-spacing:.4px;margin-bottom:4px;}
h2.step-h{margin:0 0 4px;font-size:19px;font-weight:800;}
.step-desc{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}

.footer-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:linear-gradient(to top, var(--paper) 60%, transparent);
  padding:14px 0 10px;pointer-events:none;}
.footer-bar .inner{max-width:480px;width:100%;padding:0 18px;pointer-events:auto;display:flex;gap:10px;}
.primary-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);padding:15px;
  font-weight:800;font-size:15px;box-shadow:var(--shadow);}
.primary-btn:disabled{background:#B8C0C6;box-shadow:none;}
.primary-btn.amber{background:var(--amber);}
.ghost-btn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:var(--radius);padding:13px;font-weight:700;font-size:14px;width:100%;}

/* ---- sentence page ---- */
.sent-progress{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:6px;}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:14px;box-shadow:var(--shadow);}
.scard .vi{font-size:13.5px;color:var(--muted);margin-bottom:8px;}
.scard .en{font-size:18px;font-weight:800;color:var(--navy);}
.scard .ipa{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:3px;}
.scard .cn{font-size:18px;font-weight:700;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.scard .py{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal);margin-top:3px;}
.scard .toolrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.tiny-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--ink);}
.tiny-btn.on{background:var(--amber-l);border-color:var(--amber);color:var(--amber-dk);}

.mini-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
.mini-box h4{margin:0 0 8px;font-size:12.5px;font-weight:800;color:var(--amber-dk);text-transform:uppercase;letter-spacing:.4px;}
.mini-vocab-item{padding:8px 0;border-bottom:1px dashed var(--line);}
.mini-vocab-item:last-child{border-bottom:none;}
.mini-vocab-item .row1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.mini-vocab-item .w-en{font-weight:800;color:var(--navy);font-size:14px;}
.mini-vocab-item .w-pos{font-size:10px;font-weight:700;color:var(--teal);background:var(--teal-l);padding:1px 7px;border-radius:6px;white-space:nowrap;}
.mini-vocab-item .w-ipa{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);}
.mini-vocab-item .row2{margin-top:3px;font-size:13px;color:var(--ink);}
.mini-vocab-item .w-cn{font-weight:700;}
.mini-vocab-item .w-py{font-family:'JetBrains Mono',monospace;color:var(--teal);font-size:11.5px;}
.mini-vocab-item .w-vi{color:var(--muted);}
.gram-pattern{padding:8px 0;border-bottom:1px dashed var(--line);}
.gram-pattern:last-child{border-bottom:none;}
.gram-pattern .formula-box{font-family:'JetBrains Mono',monospace;background:var(--navy);color:#EFE7DA;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.5;margin-bottom:4px;}
.gram-pattern .note{font-size:12.5px;color:var(--muted);}

.write-box{background:#FFFDF7;border:1.5px dashed var(--amber);border-radius:var(--radius);padding:15px;margin-bottom:12px;}
.write-box h4{margin:0 0 4px;font-size:13px;font-weight:800;color:var(--amber-dk);}
.write-box .prompt-vi{font-size:15px;font-weight:700;margin-bottom:10px;}
.write-box label{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;}

.sent-nav{display:flex;gap:10px;margin-top:6px;}
.sent-nav button{flex:1;}

.summary-section{margin-bottom:18px;}
.summary-section h3{font-size:15px;margin:0 0 10px;}

/* ---- exercise ---- */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);margin-bottom:14px;}
.q-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber-dk);font-weight:700;margin-bottom:6px;}
.q-text{font-size:16px;font-weight:700;margin-bottom:14px;line-height:1.4;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:12px 14px;margin-bottom:9px;font-size:14.5px;font-weight:600;color:var(--ink);}
.opt.correct{border-color:var(--green);background:#EAF7EF;color:#1E6B41;}
.opt.wrong{border-color:var(--red);background:#FCEDEA;color:#9B3423;}
.fb{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.5;}
.fb.ok{background:#EAF7EF;color:#1E6B41;}
.fb.bad{background:#FCEDEA;color:#9B3423;}
.text-input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;margin-bottom:10px;}
.text-input:focus{outline:none;border-color:var(--amber);}
.check-btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13.5px;}
.word-score{display:inline-block;margin:2px 3px;padding:2px 7px;border-radius:6px;font-size:13.5px;font-weight:700;}
.word-score.hit{background:#EAF7EF;color:#1E6B41;}
.word-score.miss{background:#FCEDEA;color:#9B3423;}

/* ---- mode tabs ---- */
.level-tabs{display:flex;gap:6px;margin-bottom:14px;}
.level-tab{flex:1;text-align:center;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:12.5px;color:var(--muted);}
.level-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.play-big{width:100%;background:var(--teal);color:#fff;border:none;border-radius:var(--radius);padding:22px;font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px;}

/* ---- test result ---- */
.score-ring{width:160px;height:160px;border-radius:50%;margin:14px auto 8px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;position:relative;}
.score-ring .num{font-size:38px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.score-ring .lbl{font-size:12px;color:var(--muted);}
.cat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.cat-row b{font-family:'JetBrains Mono',monospace;}

.xp-toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px;z-index:60;box-shadow:var(--shadow);}

.empty-note{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:13.5px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ DATA ============ */

const SCHEMA_VERSION = 3;

/* ============ STORAGE ============ */
let STATE = null;

function defaultState(){
  const days = {};
  DATA.forEach(d=>{
    days[d.id] = {
      hardSentences:[],
      stepsDone:{sentences:false,reading:false,listening:false,writing:false,test:false},
      testScore:null, testCats:null, completed:false, unlocked: d.id===1
    };
  });
  return { xp:0, streak:0, lastActiveDate:null, currentDay:1, currentStep:0, days, wrongPool:[], mode:'both', schemaVersion: SCHEMA_VERSION };
}

const STORAGE_KEY = 'lltp_state_v3';

async function loadState(){
  try{
    if(window.storage){
      const r = await window.storage.get('state');
      if(r && r.value){
        const parsed = JSON.parse(r.value);
        if(parsed && parsed.schemaVersion === SCHEMA_VERSION){ STATE = parsed; return; }
      }
    }
  }catch(e){}
  try{
    const raw = window.localStorage ? window.localStorage.getItem(STORAGE_KEY) : null;
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.schemaVersion === SCHEMA_VERSION){ STATE = parsed; return; }
    }
  }catch(e){}
  STATE = defaultState();
}
async function saveState(){
  const json = JSON.stringify(STATE);
  try{ if(window.storage){ await window.storage.set('state', json); } }catch(e){}
  try{ if(window.localStorage){ window.localStorage.setItem(STORAGE_KEY, json); } }catch(e){}
}
function touchStreak(){
  const today = new Date().toDateString();
  if(STATE.lastActiveDate !== today){
    const last = STATE.lastActiveDate ? new Date(STATE.lastActiveDate) : null;
    if(last){
      const diffDays = Math.round((new Date(today) - new Date(last.toDateString())) / 86400000);
      STATE.streak = diffDays === 1 ? STATE.streak + 1 : 1;
    } else { STATE.streak = 1; }
    STATE.lastActiveDate = today;
  }
}
function addXP(n){ STATE.xp += n; showXPToast(n); }
function showXPToast(n){
  const t = document.createElement('div');
  t.className='xp-toast'; t.textContent = '+ '+n+' XP';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1400);
}

    u.lang = lang; u.rate = lang.startsWith('zh') ? 0.85 : 0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function norm(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
}
function wordOverlapScore(target, said){
  const t = norm(target).split(' ').filter(Boolean);
  const s = new Set(norm(said).split(' ').filter(Boolean));
  if(t.length===0) return {pct:0, words:[]};
  let hit=0;
  const words = t.map(w=>{ const ok = s.has(w); if(ok) hit++; return {w, ok}; });
  return {pct: Math.round(100*hit/t.length), words};
}
function stripCn(s){ return (s||'').replace(/[^\u4e00-\u9fff]/g,''); }
function charOverlapScore(target, said){
  const t = stripCn(target).split('');
  const pool = stripCn(said).split('');
  if(t.length===0) return {pct:0, words:[]};
  let hit=0;
  const words = t.map(ch=>{
    const pos = pool.indexOf(ch);
    const ok = pos>=0;
    if(ok){ hit++; pool.splice(pos,1); }
    return {w:ch, ok};
  });
  return {pct: Math.round(100*hit/t.length), words};
}
// Accepts either Hanzi or toneless Pinyin for a Chinese-writing answer.
function checkCnAnswer(sentence, said){
  const hasHan = /[\u4e00-\u9fff]/.test(said||'');
  if(hasHan){
    const sc = charOverlapScore(sentence.c, said);
    return {pct: sc.pct, ok: sc.pct>=70, mode:'hanzi', words: sc.words};
  }
  const sc = wordOverlapScore(sentence.y, said);
  return {pct: sc.pct, ok: sc.pct>=70, mode:'pinyin', words: sc.words};
}
function pickLang(mode, i){
  if(mode==='en') return 'en';
  if(mode==='cn') return 'cn';
  return i%2===0 ? 'en' : 'cn';
}

}
function resolveWrong(key){

  if(item){ item.count--; if(item.count<=0) STATE.wrongPool = STATE.wrongPool.filter(w=>w.key!==key); }

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(arr,n){ return shuffle(arr).slice(0,n); }

function genReadingQs(day, count, mode){
  mode = mode || 'both';
  const S = day.sentences; const qs = [];
  const idxs = pick(S.map((_,i)=>i), Math.min(count, S.length));
  idxs.forEach((idx,k)=>{
    const s = S[idx];
    const lang = pickLang(mode, k);
    const variant = k % 3;
    if(lang==='en'){
      if(variant!==2){
        const distractors = pick(S.filter((_,i)=>i!==idx).map(x=>x.v), 3);
        const options = shuffle([s.v, ...distractors]);
        qs.push({kind:'mcq', skill:'reading', idx, lang, prompt:s.e, sub:'🇬🇧 Đọc câu tiếng Anh, chọn nghĩa tiếng Việt đúng:', options, answer: options.indexOf(s.v), sentence:s});
      } else {
        const words = s.e.replace(/[.?!]/g,'').split(' ');
        const blankPos = Math.max(1, Math.floor(words.length/2));
        const answerWord = words[blankPos].replace(/[,]/g,'');
        const masked = words.map((w,i)=> i===blankPos ? '_____' : w).join(' ');
        qs.push({kind:'fill', skill:'reading', idx, lang, prompt: masked, sub:'🇬🇧 Điền từ tiếng Anh còn thiếu:', vi:s.v, answer: answerWord.toLowerCase(), sentence:s});
      }
    } else {
      if(variant===0){
        const distractors = pick(S.filter((_,i)=>i!==idx).map(x=>x.v), 3);
        const options = shuffle([s.v, ...distractors]);
        qs.push({kind:'mcq', skill:'reading', idx, lang, prompt:s.c, sub:'🇨🇳 Đọc câu tiếng Trung, chọn nghĩa tiếng Việt đúng:', options, answer: options.indexOf(s.v), sentence:s});
      } else if(variant===1){
        const distractors = pick(S.filter((_,i)=>i!==idx).map(x=>x.y), 3);
        const options = shuffle([s.y, ...distractors]);
        qs.push({kind:'mcq', skill:'reading', idx, lang, prompt:s.c, sub:'🇨🇳 Chọn phiên âm Pinyin đúng cho câu này:', options, answer: options.indexOf(s.y), sentence:s});
      } else {
        const pyWords = s.y.replace(/[.?!]/g,'').split(' ');
        const blankPos = Math.max(1, Math.floor(pyWords.length/2));
        const answerWord = pyWords[blankPos].replace(/[,]/g,'');
        const masked = pyWords.map((w,i)=> i===blankPos ? '_____' : w).join(' ');
        qs.push({kind:'fill', skill:'reading', idx, lang, prompt: s.c+'\n'+masked, sub:'🇨🇳 Điền âm Pinyin còn thiếu:', vi:s.v, answer: answerWord.toLowerCase(), sentence:s});
      }
    }
  });
  return qs;
}

function genListeningQs(day, count, mode){
  mode = mode || 'both';
  const S = day.sentences; const qs=[];
  const idxs = pick(S.map((_,i)=>i), Math.min(count, S.length));
  idxs.forEach((idx,k)=>{
    const s = S[idx];
    const lang = pickLang(mode, k);
    const audio = lang==='en' ? s.e : s.c;
    if(k%2===0){
      const distractors = pick(S.filter((_,i)=>i!==idx).map(x=>x.v), 3);
      const options = shuffle([s.v, ...distractors]);
      qs.push({kind:'mcq', skill:'listening', idx, lang, audio, sub:(lang==='en'?'🇬🇧':'🇨🇳')+' Nghe và chọn nghĩa đúng:', options, answer: options.indexOf(s.v), sentence:s});
    } else if(lang==='en'){
      qs.push({kind:'type', skill:'listening', idx, lang, audio, sub:'🇬🇧 Nghe và gõ lại câu tiếng Anh:', answer: s.e, sentence:s});
    } else {
      qs.push({kind:'type', skill:'listening', idx, lang, audio, sub:'🇨🇳 Nghe rồi gõ lại (Hán tự hoặc Pinyin không dấu):', answer: s.y, sentence:s});
    }
  });
  return qs;
}

function genWritingQs(day, count, mode){
  mode = mode || 'both';
  const S = day.sentences; const qs=[];
  const idxs = pick(S.map((_,i)=>i), Math.min(count, S.length));
  idxs.forEach((idx,k)=>{
    const s = S[idx];
    const lang = pickLang(mode, k);
    if(lang==='en'){
      qs.push({kind:'write', skill:'writing', idx, lang, prompt:s.v, sub:'🇬🇧 Viết câu tiếng Anh tương ứng:', answer: s.e, sentence:s});
    } else {
      qs.push({kind:'write', skill:'writing', idx, lang, prompt:s.v, sub:'🇨🇳 Viết câu tiếng Trung tương ứng (Hán tự hoặc Pinyin không dấu đều được):', answer: s.y, sentence:s});
    }
  });
  return qs;
}

function genVocabQs(day, count){
  const V = day.vocab; const qs=[];
  const n = Math.min(count, V.length);
  const idxs = pick(V.map((_,i)=>i), n);
  idxs.forEach((idx,k)=>{
    const v = V[idx];
    const lang = pickLang('both', k);
    const distractors = pick(V.filter((_,i)=>i!==idx).map(x=>x.vi).concat(
      DATA.flatMap(d=>d.vocab.map(x=>x.vi))
    ), 6).filter(x=>x!==v.vi).slice(0,3);
    const options = shuffle([v.vi, ...distractors]);
    const prompt = lang==='en' ? v.en : (v.cn+' ('+v.py+')');
    qs.push({kind:'mcq', skill:'vocab', idx, lang, prompt, sub:(lang==='en'?'🇬🇧':'🇨🇳')+' Chọn nghĩa tiếng Việt đúng:', options, answer: options.indexOf(v.vi)});
  });
  return qs;
}

function genGrammarQs(day, count){
  const pool = (day.gramCore && day.gramCore.length) ? day.gramCore : [{en:'S + V + O',cn:'S + V + O',note:'Câu cơ bản'}];
  const qs = [];
  for(let k=0;k<count;k++){
    const g = pool[k % pool.length];
    let others = pool.filter(x=>x.en!==g.en).map(x=>x.en);
    if(others.length<2){
      const otherPool = DATA.flatMap(dd=>dd.gramCore||[]).map(x=>x.en).filter(x=>x!==g.en);
      others = Array.from(new Set(others.concat(otherPool)));
    }
    const distractors = pick(Array.from(new Set(others)), Math.min(2, others.length));
    const options = shuffle([g.en, ...distractors]);
    const prompt = (g.note && g.note.trim()) ? ('Cấu trúc nào phù hợp để diễn tả: "'+g.note+'"?') : ('Cấu trúc nào tương ứng với mẫu tiếng Trung: '+g.cn+' ?');
    qs.push({kind:'mcq', skill:'grammar', idx:k, prompt, sub:'', options, answer: options.indexOf(g.en)});
  }
  return qs;
}

    <div class="eyebrow">CÂU ${EX.i+1}/${EX.qs.length}</div>
    <h2 class="step-h">${STEP_ICONS[stepKey]} ${STEP_LABELS[stepKey]}</h2>
    <div class="step-desc">${stepDesc}</div>
    ${modeTabs()}
    <div id="ex-slot">${renderQuestion(q, stepKey)}</div>
  </div>`;
}

function renderQuestion(q, stepKey){
  if(q.skill==='listening'){
    const ttsLang = q.lang==='cn' ? 'zh-CN' : 'en-US';
    let inner = `<div class="q-card">
      <div class="q-num">NGHE VÀ TRẢ LỜI ${q.lang==='cn'?'🇨🇳':'🇬🇧'}</div>
      <button class="play-big" data-action="speak" data-lang="${ttsLang}" data-text="${escAttr(q.audio)}">🔊 Nghe câu</button>`;
    if(q.kind==='mcq'){
      inner += renderMcqOptions(q);
    } else {
      inner += `<input class="text-input" id="type-ans" placeholder="${q.lang==='cn'?'Gõ lại Hán tự hoặc Pinyin...':'Gõ lại câu tiếng Anh bạn nghe được...'}" ${window.__answered?'disabled':''} value="${escAttr(window.__typedVal||'')}"/>
      ${window.__answered? '' : `<button class="check-btn" data-action="submit-type">Kiểm tra</button>`}
      ${window.__answered? renderTypeFeedback(q) : ''}`;
    }
    inner += `</div>`;
    return inner;
  }
  if(q.kind==='mcq'){
    return `<div class="q-card"><div class="q-num">CÂU HỎI</div><div class="q-text">${q.prompt}</div><div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">${q.sub||''}</div>${renderMcqOptions(q)}</div>`;
  }
  if(q.kind==='fill'){
    return `<div class="q-card"><div class="q-num">ĐIỀN TỪ CÒN THIẾU ${q.lang==='cn'?'🇨🇳':'🇬🇧'}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">🇻🇳 ${q.vi}</div>
      <div class="q-text">${q.prompt.replace(/\n/g,'<br>')}</div>
      <input class="text-input" id="type-ans" placeholder="${q.lang==='cn'?'Nhập âm Pinyin còn thiếu...':'Nhập từ còn thiếu...'}" ${window.__answered?'disabled':''} value="${escAttr(window.__typedVal||'')}"/>
      ${window.__answered? '' : `<button class="check-btn" data-action="submit-type">Kiểm tra</button>`}
      ${window.__answered? renderTypeFeedback(q) : ''}
    </div>`;
  }
  if(q.kind==='write'){
    return `<div class="q-card"><div class="q-num">VIẾT CÂU ${q.lang==='cn'?'🇨🇳':'🇬🇧'}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">🇻🇳</div>
      <div class="q-text">${q.prompt}</div>
      <textarea class="text-input" id="type-ans" rows="3" placeholder="${q.lang==='cn'?'Hán tự hoặc Pinyin không dấu...':'Viết câu tiếng Anh...'}" ${window.__answered?'disabled':''}>${window.__typedVal||''}</textarea>
      ${window.__answered? '' : `<button class="check-btn" data-action="submit-write">Chấm điểm</button>`}
      ${window.__answered? renderWriteFeedback(q) : ''}
    </div>`;
  }
  return '';
}
function renderMcqOptions(q){
  const picked = window.__answered ? window.__pickedIdx : undefined;
  return q.options.map((o,i)=>{
    let cls='opt';
    if(picked!==undefined){
      if(i===q.answer) cls+=' correct'; else if(i===picked) cls+=' wrong';
    }
    return `<button class="${cls}" data-action="pick-mcq" data-idx="${i}" ${picked!==undefined?'disabled':''}>${o}</button>`;
  }).join('') + (picked!==undefined ? mcqFeedback(q,picked) : '');
}
function mcqFeedback(q,picked){
  const ok = picked===q.answer;
  return `<div class="fb ${ok?'ok':'bad'}">${ok?'✅ Chính xác!':'❌ Đáp án đúng: '+q.options[q.answer]}</div>
    <button class="check-btn" style="margin-top:12px" data-action="next-q">Câu tiếp theo →</button>`;
}
function renderTypeFeedback(q){
  const said = window.__typedVal||'';
  let ok, detail='';
  if(q.kind==='type' && q.lang==='cn'){
    const sc = checkCnAnswer(q.sentence, said);
    ok = sc.ok;
    detail = ` (khớp ${sc.pct}% theo ${sc.mode==='hanzi'?'Hán tự':'Pinyin'})`;
  } else {
    ok = norm(said)===norm(q.answer);
  }
  return `<div class="fb ${ok?'ok':'bad'}">${ok?'✅ Chính xác!'+detail:'❌ Chưa đúng'+detail+'. Đáp án đúng: "'+q.answer+'"'}</div>
    <button class="check-btn" style="margin-top:12px" data-action="next-q">Câu tiếp theo →</button>`;
}
function renderWriteFeedback(q){
  const said = window.__typedVal||'';
  let sc, label;
  if(q.lang==='cn'){
    sc = checkCnAnswer(q.sentence, said);
    label = 'khớp '+sc.pct+'% theo '+(sc.mode==='hanzi'?'Hán tự':'Pinyin');
  } else {
    sc = wordOverlapScore(q.answer, said);
    sc.ok = sc.pct>=70;
    label = 'khớp '+sc.pct+'% từ khoá';
  }
  const wordsHtml = (sc.words||[]).map(w=>`<span class="word-score ${w.ok?'hit':'miss'}">${w.w}</span>`).join(' ');
  return `<div class="fb ${sc.ok?'ok':'bad'}">${sc.ok?'✅ Tốt! '+label+'.':'❌ Chưa đạt — '+label+' (cần ≥70%).'}
    <div style="margin-top:8px">Đáp án mẫu: <b>${q.answer}</b>${q.lang==='cn'?' / <b>'+q.sentence.c+'</b>':''}</div>
    <div style="margin-top:6px">${wordsHtml}</div></div>
    <button class="check-btn" style="margin-top:12px" data-action="next-q" data-ok="${sc.ok}">Câu tiếp theo →</button>`;
}

/* ---- TEST ---- */
function buildTest(d){
  return {
    'Từ vựng': genVocabQs(d,5),
    'Ngữ pháp': genGrammarQs(d,5),
    'Đọc': genReadingQs(d,5,'both'),
    'Nghe': genListeningQs(d,5,'both'),
    'Viết': genWritingQs(d,5,'both'),
  };
}
function renderTest(d,p){
  if(!EX || EX.day!==d.id || EX.step!=='test'){
    const cats = buildTest(d);
    const flat = [];
    Object.entries(cats).forEach(([cat,qs])=>qs.forEach(q=>flat.push({...q, cat})));
    EX = {day:d.id, step:'test', qs: flat, i:0, correctCount:0, done:false, catStats:{}};
  }
  if(EX.done){ return renderTestResult(d,p); }
  const q = EX.qs[EX.i];
  return `<div class="content">
    <div class="eyebrow">KIỂM TRA CUỐI NGÀY · CÂU ${EX.i+1}/${EX.qs.length} · ${q.cat.toUpperCase()}</div>
    <h2 class="step-h">🏁 Kiểm tra tổng hợp</h2>
    ${renderQuestion(q, q.kind==='write'?'writing':(q.skill==='listening'?'listening':'reading'))}
  </div>`;
}
function renderTestResult(d,p){
  const score = p.testScore;
  const pass = score>=80;
  return `<div class="content">
    <div class="score-ring" style="background:conic-gradient(${pass?'var(--green)':'var(--amber)'} ${score*3.6}deg, var(--line) 0)">
      <div style="background:var(--paper);width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div class="num">${score}</div><div class="lbl">/ 100</div>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:18px;font-weight:800;font-size:16px;color:${pass?'var(--green)':'var(--amber-dk)'}">
      ${pass? '🎉 Đạt! Ngày '+d.id+' đã hoàn thành' : '⚠️ Chưa đạt 80 điểm — hãy học lại phần yếu'}
    </div>
    <div class="q-card">
      ${Object.entries(p.testCats||{}).map(([cat,st])=>`<div class="cat-row"><span>${cat}</span><b>${st.correct}/${st.total}</b></div>`).join('')}
    </div>
  </div>
  ${footerBtn(pass? 'Về trang chủ →' : 'Làm lại bài kiểm tra', `data-action='${pass?'go-home':'retry-test'}'`)}`;
}

/* ---- REVIEW ---- */
function renderReview(){
  const pool = STATE.wrongPool.slice().sort((a,b)=>b.count-a.count);
  if(pool.length===0){
    return topBar('Ôn tập hôm nay','',true) + `<div class="content"><div class="empty-note">🎉 Không còn nội dung cần ôn tập. Bạn đang học rất tốt!</div></div>`;
  }
  const item = pool[0];
  const day = DATA.find(x=>x.id===item.day);
  let text='', vi='', cn='';
  if(item.skill==='vocab'){
    const v = day.vocab[item.idx % day.vocab.length];
    text=v.en; vi=v.vi; cn=v.cn+' · '+v.py;
  } else if(item.skill==='grammar'){
    const g = (day.gramCore||[])[item.idx % Math.max(1,(day.gramCore||[]).length)] || {en:'',cn:'',note:''};
    text=g.en; vi=g.note||''; cn=g.cn;
  } else {
    const s = day.sentences[item.idx % day.sentences.length];
    text=s.e; vi=s.v; cn=s.c+' · '+s.y;
  }
  return topBar('Ôn tập hôm nay', pool.length+' mục cần ôn', true) + `
  <div class="content">
    <div class="step-desc">Nội dung sai nhiều lần sẽ xuất hiện thường xuyên hơn cho đến khi bạn nhớ được.</div>
    <div class="q-card" style="text-align:center">
      <div class="q-num">NGÀY ${item.day} · ${item.skill.toUpperCase()} · SAI ${item.count} LẦN</div>
      <div class="q-text" style="font-size:19px">${text}</div>
      <button class="icon-btn" style="margin:8px auto" data-action="speak" data-lang="en-US" data-text="${escAttr(text)}">🔊 Nghe</button>
      <div id="review-answer" class="${window.__reviewShown?'':'hidden'}">
        <p style="margin-top:10px">🇻🇳 ${vi}</p>
        <p style="color:var(--teal)">🇨🇳 ${cn}</p>
      </div>
      ${window.__reviewShown ? '' : `<button class="check-btn" style="margin-top:10px" data-action="review-show">Xem đáp án</button>`}
    </div>
    ${window.__reviewShown ? `<div style="display:flex;gap:10px">
      <button class="ghost-btn" data-action="review-answer" data-key="${item.key}" data-ok="0">Vẫn còn sai</button>
      <button class="primary-btn amber" data-action="review-answer" data-key="${item.key}" data-ok="1">Nhớ rồi ✓</button>
    </div>` : ''}
  </div>`;
}

/* ---- helpers ---- */
function footerBtn(label, attrs){
  return `<div class="footer-bar"><div class="inner"><button class="primary-btn amber" ${attrs}>${label}</button></div></div>`;
}
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

/* ============ EVENTS ============ */
document.addEventListener('input', (e)=>{
  if(e.target.id==='type-ans'){ window.__typedVal = e.target.value; }
  if(e.target.id==='wf-en'){ window.__wfEn = e.target.value; }
  if(e.target.id==='wf-cn'){ window.__wfCn = e.target.value; }
});

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  try{
    await handleAction(el);
  }catch(err){
    console.error('App error on action', el.dataset.action, err);
    EX = null;
    window.__resetLocalUi();
    STATE.currentStep = 0;
    try{ await saveState(); }catch(e2){}
    VIEW = 'home';
    render();
    const banner = document.createElement('div');
    banner.className = 'xp-toast';
    banner.style.background = 'var(--red)';
    banner.textContent = 'Có lỗi nhỏ, đã đưa bạn về trang chủ. Nếu lặp lại, bấm "Làm mới dữ liệu" ở cuối trang.';
    document.body.appendChild(banner);
    setTimeout(()=>banner.remove(), 3200);
  }
});

async function handleAction(el){
  const action = el.dataset.action;

  if(action==='reset-data'){
    if(!confirm('Xoá toàn bộ tiến trình học và bắt đầu lại từ Ngày 1?')) return;
    STATE = defaultState();
    EX = null; window.__resetLocalUi();
    try{ if(window.storage) await window.storage.delete('state'); }catch(e){}
    try{ if(window.localStorage) window.localStorage.removeItem(STORAGE_KEY); }catch(e){}
    await saveState();
    go('home');
  }

  else if(action==='go-home'){ EX=null; window.__resetLocalUi(); await saveState(); go('home'); }

  else if(action==='continue-learning'){ window.__resetLocalUi(); go('lesson'); }

  else if(action==='open-day'){
    const dayId = parseInt(el.dataset.day,10);
    if(STATE.days[dayId].unlocked){ STATE.currentDay = dayId; STATE.currentStep = 0; EX=null; window.__resetLocalUi(); await saveState(); go('lesson'); }
  }

  else if(action==='open-review'){ window.__reviewShown=false; go('review'); }

  else if(action==='speak'){ speak(el.dataset.text, el.dataset.lang); }

  else if(action==='toggle-hard'){
    const idx = parseInt(el.dataset.idx,10);
    const p = STATE.days[STATE.currentDay];
    const pos = p.hardSentences.indexOf(idx);
    if(pos>=0) p.hardSentences.splice(pos,1); else { p.hardSentences.push(idx); pushWrong(STATE.currentDay,'sentence',idx); }
    await saveState(); render();
  }

  else if(action==='check-write-flow'){
    window.__wfEn = document.getElementById('wf-en').value;
    window.__wfCn = document.getElementById('wf-cn').value;
    window.__wfAnswered = true;
    await saveState();
    render();
  }

  else if(action==='sent-next'){
    const d = currentDayData();
    const i = window.__sentIdx||0;
    if(i >= d.sentences.length-1){
      window.__sentPhase = 'summary';
    } else {
      window.__sentIdx = i+1;
      window.__wfAnswered=false; window.__wfEn=''; window.__wfCn='';
    }
    render();
  }
  else if(action==='sent-prev'){
    const i = window.__sentIdx||0;
    if(i>0){ window.__sentIdx = i-1; window.__wfAnswered=false; window.__wfEn=''; window.__wfCn=''; }
    render();
  }
  else if(action==='sentences-done'){
    const p = STATE.days[STATE.currentDay];
    p.stepsDone.sentences = true;
    STATE.currentStep = Math.min(1, STEP_KEYS.length-1);
    window.__sentIdx=0; window.__sentPhase=null;
    EX=null; window.__resetLocalUi();
    await saveState(); render();
  }

  else if(action==='set-mode'){
    STATE.mode = el.dataset.mode;
    EX = null; window.__resetLocalUi();
    await saveState(); render();
  }

  else if(action==='step-done'){
    const step = el.dataset.step;
    const p = STATE.days[STATE.currentDay];
    p.stepsDone[step] = true;
    const idx = STEP_KEYS.indexOf(step);
    STATE.currentStep = Math.min(idx+1, STEP_KEYS.length-1);
    EX=null; window.__resetLocalUi();
    await saveState(); render();
  }

  else if(action==='pick-mcq'){
    if(window.__answered) return;
    window.__answered = true;
    window.__pickedIdx = parseInt(el.dataset.idx,10);
    const q = EX.qs[EX.i];
    const ok = window.__pickedIdx===q.answer;
    if(ok) EX.correctCount++; else pushWrong(STATE.currentDay, q.skill, q.idx);
    if(EX.step==='test'){ recordCat(q.cat, ok); }
    await saveState();
    render();
  }

  else if(action==='submit-type'){
    const val = document.getElementById('type-ans').value;
    window.__typedVal = val; window.__answered = true;
    const q = EX.qs[EX.i];
    let ok;
    if(q.kind==='type' && q.lang==='cn'){ ok = checkCnAnswer(q.sentence, val).ok; }
    else { ok = norm(val)===norm(q.answer); }
    if(ok) EX.correctCount++; else pushWrong(STATE.currentDay, q.skill, q.idx);
    if(EX.step==='test'){ recordCat(q.cat, ok); }
    await saveState();
    render();
  }

  else if(action==='submit-write'){
    const val = document.getElementById('type-ans').value;
    window.__typedVal = val; window.__answered = true;
    const q = EX.qs[EX.i];
    let ok;
    if(q.lang==='cn'){ ok = checkCnAnswer(q.sentence, val).ok; }
    else { ok = wordOverlapScore(q.answer, val).pct >= 70; }
    if(ok) EX.correctCount++; else pushWrong(STATE.currentDay, q.skill, q.idx);
    if(EX.step==='test'){ recordCat(q.cat, ok); }
    await saveState();
    render();
  }

  else if(action==='next-q'){
    EX.i++;
    window.__answered=false; window.__pickedIdx=undefined; window.__typedVal='';
    if(EX.i>=EX.qs.length){
      EX.done = true;
      if(EX.step==='test'){ finishTest(); }
      else { finishSkillStep(); }
    }
    await saveState();
    render();
  }

  else if(action==='retry-test'){ EX=null; await saveState(); go('lesson'); }

  else if(action==='review-show'){ window.__reviewShown = true; render(); }
  else if(action==='review-answer'){
    const key = el.dataset.key; const ok = el.dataset.ok==='1';
    if(ok) resolveWrong(key);
    window.__reviewShown = false;
    await saveState();
    render();
  }
}

function recordCat(cat, ok){
  EX.catStats[cat] = EX.catStats[cat] || {correct:0,total:0};
  EX.catStats[cat].total++;
  if(ok) EX.catStats[cat].correct++;
}
function finishSkillStep(){
  const p = STATE.days[STATE.currentDay];
  const step = EX.step;
  const acc = EX.correctCount/EX.qs.length;
  addXP(Math.round(EX.correctCount*3));
  if(acc>=0.6){ p.stepsDone[step]=true; }
  const idx = STEP_KEYS.indexOf(step);
  STATE.currentStep = Math.min(idx+1, STEP_KEYS.length-1);
}
function finishTest(){
  const p = STATE.days[STATE.currentDay];
  const total = EX.qs.length;
  const score = Math.round(100*EX.correctCount/total);
  p.testScore = score;
  p.testCats = EX.catStats;
  if(score>=80){
    p.stepsDone.test = true;
    p.completed = true;
    addXP(50);
    const d = currentDayData();
    const nextDay = DATA.find(x=>x.id===d.id+1);
    if(nextDay) STATE.days[nextDay.id].unlocked = true;
  }
}

window.__resetLocalUi = function(){
  window.__answered=false; window.__pickedIdx=undefined; window.__typedVal='';
  window.__reviewShown=false;
  window.__sentIdx=0; window.__sentPhase=null;
  window.__wfAnswered=false; window.__wfEn=''; window.__wfCn='';
};
window.__resetLocalUi();

init();
</script>
</body>
</html>
